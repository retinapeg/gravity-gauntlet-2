<title>Gravity Gauntlet Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --void:#0A0F1E; --panel:#151C31; --panel-2:#111728; --line:#28324F; --line-soft:#1D2540;
  --ink:#E9ECF7; --ink-dim:#9AA6C4; --ink-faint:#63709A;
  --star:#F2B33D; --portal:#3FD6C4; --craft:#FF7A66; --planet:#8C6BE0;
  --ok:#3FD6C4; --warn:#F2B33D; --bad:#FF6B7A; --idle:#63709A;
  --grid-w:4;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--void); color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13px; line-height:1.5; overflow-x:hidden;
  background-image:radial-gradient(ellipse 90% 60% at 50% -10%,#16203c 0%,transparent 70%);
}
.wrap{max-width:1500px;margin:0 auto;padding:22px 20px 96px}
h1,h2,h3,.disp{font-family:"Chakra Petch","Chakra Petch Fallback",system-ui,sans-serif}

/* ---- rail ---- */
.rail{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;
  border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.02em;text-wrap:balance}
h1 .g{color:var(--star)}
.sub{color:var(--ink-dim);font-size:12px;margin-top:4px;max-width:66ch}
.sub b{color:var(--portal);font-weight:500}

/* ---- rung ladder ---- */
.rungs{display:flex;gap:6px}
.rung{appearance:none;cursor:pointer;background:var(--panel);color:var(--ink-dim);
  border:1px solid var(--line);border-radius:2px;padding:8px 13px;
  font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;transition:background .15s,color .15s,border-color .15s}
.rung:hover{color:var(--ink);border-color:var(--ink-faint)}
.rung[aria-pressed="true"]{background:var(--star);color:#231800;border-color:var(--star)}
.rung:focus-visible{outline:2px solid var(--portal);outline-offset:2px}
.rung small{display:block;font-family:"IBM Plex Mono",monospace;font-weight:400;
  font-size:9px;letter-spacing:.04em;text-transform:none;opacity:.75;margin-top:2px}

/* ---- stat strip ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;
  background:var(--line-soft);border:1px solid var(--line-soft);margin-bottom:8px}
.stat{background:var(--panel-2);padding:10px 13px}
.stat .k{color:var(--ink-faint);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
.stat .v{font-size:19px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;
  font-family:"Chakra Petch",sans-serif}
.stat .v.ok{color:var(--ok)} .stat .v.bad{color:var(--bad)} .stat .v.star{color:var(--star)}

.note{color:var(--ink-faint);font-size:11.5px;margin:0 0 18px;padding:9px 13px;
  border-left:2px solid var(--line);background:var(--panel-2)}
.note b{color:var(--ink-dim);font-weight:500}

/* ---- grid ---- */
.grid{display:grid;grid-template-columns:repeat(var(--grid-w),1fr);gap:12px}
@media(max-width:1180px){:root{--grid-w:3}}
@media(max-width:860px){:root{--grid-w:2}}
@media(max-width:560px){:root{--grid-w:1}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow:hidden;
  display:flex;flex-direction:column;transition:border-color .2s}
.card.done-portal{border-color:rgba(63,214,196,.55)}
.card.done-crashed{border-color:rgba(255,107,122,.5)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:7px 10px;border-bottom:1px solid var(--line-soft);background:var(--panel-2)}
.sbx{color:var(--ink-faint);font-size:10px;letter-spacing:.04em}
.sbx b{color:var(--ink-dim);font-weight:500}
.chip{font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2.5px 7px;border-radius:2px;
  font-family:"Chakra Petch",sans-serif;font-weight:600;white-space:nowrap}
.chip.running{background:rgba(99,112,154,.18);color:var(--idle)}
.chip.success{background:rgba(63,214,196,.15);color:var(--ok)}
.chip.crashed{background:rgba(255,107,122,.15);color:var(--bad)}
.chip.timeout{background:rgba(242,179,61,.13);color:var(--warn)}
.chip.escaped{background:rgba(140,107,224,.16);color:var(--planet)}
canvas{display:block;width:100%;height:auto;background:#070B16}
.card .bot{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;
  border-top:1px solid var(--line-soft);font-size:10.5px;color:var(--ink-faint);
  font-variant-numeric:tabular-nums}
.card .bot .rw{color:var(--ink-dim);font-weight:500}
.card .bot .rw.pos{color:var(--ok)} .card .bot .rw.neg{color:var(--bad)}

/* ---- transport ---- */
.transport{position:fixed;left:0;right:0;bottom:0;background:rgba(10,15,30,.94);
  border-top:1px solid var(--line);backdrop-filter:blur(8px);padding:11px 20px;z-index:5}
.tin{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:14px}
button.play{appearance:none;cursor:pointer;background:var(--portal);color:#04211E;border:0;
  border-radius:2px;padding:8px 16px;font-family:"Chakra Petch",sans-serif;font-weight:700;
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;min-width:74px}
button.play:hover{filter:brightness(1.1)}
button.play:focus-visible{outline:2px solid var(--star);outline-offset:2px}
input[type=range]{flex:1;accent-color:var(--star);cursor:pointer;min-width:80px}
input[type=range]:focus-visible{outline:2px solid var(--portal);outline-offset:3px}
.tlabel{color:var(--ink-faint);font-size:10.5px;letter-spacing:.06em;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.spd{display:flex;gap:3px}
.spd button{appearance:none;cursor:pointer;background:var(--panel);border:1px solid var(--line);
  color:var(--ink-faint);border-radius:2px;padding:5px 8px;font-family:"IBM Plex Mono",monospace;font-size:10px}
.spd button[aria-pressed="true"]{background:var(--line);color:var(--ink)}
.spd button:focus-visible{outline:2px solid var(--portal);outline-offset:1px}
@media(max-width:640px){.tlabel.wide{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* live-only */
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);
  margin-right:6px;vertical-align:middle}
.live-dot.on{background:var(--ok);box-shadow:0 0 0 0 rgba(63,214,196,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(63,214,196,0)}100%{box-shadow:0 0 0 0 rgba(63,214,196,0)}}
.chip.creating{background:rgba(99,112,154,.18);color:var(--idle)}
.chip.live{background:rgba(140,107,224,.16);color:var(--planet)}
.chip.error{background:rgba(255,107,122,.18);color:var(--bad)}
.card.pending canvas{opacity:.18}
.log{margin-top:20px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:3px;
  max-height:190px;overflow:auto;padding:10px 13px;font-size:10.5px;color:var(--ink-faint)}
.log div{padding:1.5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log b{color:var(--ink-dim);font-weight:500}
.log .t{color:var(--planet)}
.log .ok{color:var(--ok)} .log .er{color:var(--bad)}
button.go{appearance:none;cursor:pointer;background:var(--star);color:#231800;border:0;border-radius:2px;
  padding:11px 22px;font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:13px;
  letter-spacing:.09em;text-transform:uppercase}
button.go:hover{filter:brightness(1.08)}
button.go:disabled{opacity:.45;cursor:not-allowed;filter:none}
button.go:focus-visible{outline:2px solid var(--portal);outline-offset:3px}
.stagesel{display:flex;gap:6px;align-items:center}
</style>
<div class="wrap">
  <div class="rail">
    <div>
      <h1><span class="g">Gravity</span> Gauntlet <span style="color:var(--ink-faint);font-weight:500">Live</span></h1>
      <p class="sub"><span class="live-dot" id="dot"></span><span id="conn">connecting to controller…</span>
      &mdash; press <b>Launch generation</b> and eight real Daytona sandboxes are created, run one
      episode each, and are destroyed. The cards below follow their actual lifecycle.</p>
    </div>
    <div class="stagesel">
      <div class="rungs" role="group" aria-label="Curriculum rung"></div>
      <button class="go" id="go" type="button" disabled>Launch generation</button>
    </div>
  </div>
  <div class="stats"></div>
  <p class="note"></p>
  <div class="grid"></div>
  <div class="log" id="log" aria-live="polite"></div>
</div>
<div class="transport">
  <div class="tin">
    <button class="play" type="button">Play</button>
    <span class="tlabel" id="tstep">t 0.00</span>
    <input type="range" id="scrub" min="0" max="100" value="0" aria-label="Scrub timeline">
    <span class="tlabel wide" id="tlive">idle</span>
    <span class="spd" role="group" aria-label="Playback speed"></span>
  </div>
</div>
<script>
const API = location.origin;
let stage="A", frame=0, playing=false, speed=1, maxFrames=1, cards=[], BOUNDS=null, WORLDS=[];
const grid=document.querySelector(".grid"), statsEl=document.querySelector(".stats");
const noteEl=document.querySelector(".note"), scrub=document.getElementById("scrub");
const playBtn=document.querySelector("button.play"), go=document.getElementById("go");
const logEl=document.getElementById("log"), dot=document.getElementById("dot"), conn=document.getElementById("conn");
const C=getComputedStyle(document.documentElement), col=n=>C.getPropertyValue(n).trim();
const TITLES={A:"one fixed star",B:"star + fixed planets",C:"orbiting bodies"};
const NOTES={
 A:"<b>Rung A.</b> One universe: all eight sandboxes fly the same world and differ only by action sampling.",
 B:"<b>Rung B.</b> Eight <em>different</em> planet layouts in one generation &mdash; distinct keys, distinct worlds.",
 C:"<b>Rung C.</b> The planets orbit, so the gravitational field changes during the episode."};

function log(html,cls=""){const d=document.createElement("div");if(cls)d.className=cls;
  d.innerHTML=html;logEl.prepend(d);while(logEl.children.length>140)logEl.lastChild.remove();}

const rungs=document.querySelector(".rungs");
["A","B","C"].forEach(s=>{const b=document.createElement("button");b.className="rung";b.type="button";
  b.innerHTML=`Rung ${s}<small>${TITLES[s]}</small>`;b.setAttribute("aria-pressed",s===stage);
  b.onclick=()=>{if(go.disabled&&go.dataset.busy)return;stage=s;
    [...rungs.children].forEach((c,i)=>c.setAttribute("aria-pressed",["A","B","C"][i]===stage));
    noteEl.innerHTML=NOTES[stage];skeleton();};rungs.appendChild(b);});
const spd=document.querySelector(".spd");
[0.5,1,2].forEach(v=>{const b=document.createElement("button");b.type="button";b.textContent=v+"×";
  b.setAttribute("aria-pressed",v===speed);
  b.onclick=()=>{speed=v;[...spd.children].forEach(c=>c.setAttribute("aria-pressed",c.textContent===v+"×"));};
  spd.appendChild(b);});
noteEl.innerHTML=NOTES[stage];

function setStats(rows){statsEl.innerHTML="";for(const [k,v,cls] of rows){
  const d=document.createElement("div");d.className="stat";
  d.innerHTML=`<div class="k">${k}</div><div class="v ${cls||""}">${v}</div>`;statsEl.appendChild(d);}}

function skeleton(){
  WORLDS=[];cards=[];grid.innerHTML="";
  setStats([["Generation","—",""],["Sandboxes","8",""],["Reached portal","—",""],
            ["Best reward","—",""],["Mean reward","—",""],["Fleet wall time","—","star"]]);
  for(let i=0;i<8;i++){
    const el=document.createElement("div");el.className="card pending";
    el.innerHTML=`<div class="top"><span class="sbx">sbx <b>—</b></span><span class="chip creating">idle</span></div>
      <canvas></canvas><div class="bot"><span class="key">—</span><span class="rw"></span></div>`;
    grid.appendChild(el);const cv=el.querySelector("canvas");
    cards.push({el,cv,ctx:cv.getContext("2d"),chip:el.querySelector(".chip"),
                sbx:el.querySelector(".sbx b"),rw:el.querySelector(".rw"),key:el.querySelector(".key"),w:null});
  }
  sizeAll();cards.forEach(c=>{const S=c.cv.clientWidth||260;c.ctx.fillStyle="#070B16";c.ctx.fillRect(0,0,S,S);});
  frame=0;maxFrames=1;scrub.max=1;scrub.value=0;playing=false;playBtn.textContent="Play";
  document.getElementById("tlive").textContent="idle";
}
function sizeAll(){for(const c of cards){const dpr=Math.min(devicePixelRatio||1,2);
  const w=c.cv.clientWidth||260;c.cv.width=Math.round(w*dpr);c.cv.height=Math.round(w*dpr);
  c.cv.style.height=w+"px";c.ctx.setTransform(dpr,0,0,dpr,0,0);}}

/* ---- SSE: the real sandbox lifecycle ---- */
const es=new EventSource(API+"/api/events");
es.onopen=()=>{dot.className="live-dot on";conn.textContent="controller connected";go.disabled=false;};
es.onerror=()=>{dot.className="live-dot";conn.textContent="controller offline — is `make api` running?";go.disabled=true;};
for(const ph of ["creating","live","running","finished","error","generation_start","generation_complete","generation_skipped","hello"]){
  es.addEventListener(ph,e=>onEvent(ph,JSON.parse(e.data)));
}
function onEvent(ph,d){
  if(ph==="hello")return;
  if(ph==="generation_start"){log(`<b>generation ${d.generation}</b> launching ${d.n_workers} sandboxes · policy ${d.policy_id}`,"t");return;}
  if(ph==="generation_complete"){log(`<b>generation ${d.generation}</b> complete · mean ${d.mean_reward} · success ${d.success_rate} · next ${d.next_policy_id}`,"ok");return;}
  if(ph==="generation_skipped"){log(`generation ${d.generation} skipped — ${d.reason}`,"er");return;}
  const c=cards[d.worker_id];if(!c)return;
  if(d.sandbox_id)c.sbx.textContent=d.sandbox_id.slice(0,8);
  const label=ph==="live"?"live":ph==="running"?"running":ph==="creating"?"creating":ph==="error"?"error":d.termination||"done";
  c.chip.textContent=label;c.chip.className="chip "+(ph==="finished"?(d.success?"success":(d.termination==="collision"?"crashed":d.termination||"timeout")):ph);
  if(ph==="finished"){c.rw.textContent=(d.reward>0?"+":"")+Number(d.reward).toFixed(1);
    c.rw.className="rw "+(d.reward>0?"pos":"neg");
    log(`worker ${d.worker_id} <b>${d.termination}</b> reward ${Number(d.reward).toFixed(1)} · sbx ${(d.sandbox_id||"").slice(0,8)}`,d.success?"ok":"");}
  else if(ph==="error"){log(`worker ${d.worker_id} <b>failed</b> ${d.error||""}`,"er");}
  else log(`worker ${d.worker_id} ${ph}${d.sandbox_id?" · sbx "+d.sandbox_id.slice(0,8):""}`);
}

/* ---- launch ---- */
go.onclick=async()=>{
  go.disabled=true;go.dataset.busy="1";go.textContent="Running…";skeleton();
  logEl.innerHTML="";log(`requesting a generation on rung ${stage}…`,"t");
  try{
    const r=await fetch(API+"/api/train/next?stage="+stage,{method:"POST"});
    if(!r.ok)throw new Error((await r.text()).slice(0,200));
    loadPayload(await r.json());
  }catch(e){log("launch failed: "+e.message,"er");}
  finally{go.disabled=false;delete go.dataset.busy;go.textContent="Launch generation";}
};

/* ---- animate what the sandboxes returned ---- */
function loadPayload(p){
  const STEP=2;
  WORLDS=p.rollouts.map(r=>{
    const tr=r.trajectory,idx=[];for(let i=0;i<tr.length;i+=STEP)idx.push(i);
    if(idx[idx.length-1]!==tr.length-1)idx.push(tr.length-1);
    const bt=r.bodies_trajectory||[];
    return{w:r.worker_id,sb:(r.sandbox_id||"").slice(0,8),key:r.key,st:r.status,rw:r.reward,
      path:idx.map(i=>[tr[i].x,tr[i].y]),vel:idx.map(i=>[tr[i].vx,tr[i].vy]),
      bodies:bt.length?idx.map(i=>bt[Math.min(i,bt.length-1)].map(b=>[b[0],b[1]])):[],env:r.environment};
  });
  const nOk=WORLDS.filter(w=>w.st==="success").length;
  setStats([["Generation","#"+p.generation,""],["Sandboxes",WORLDS.length,""],
    ["Reached portal",nOk+" / "+WORLDS.length,nOk?"ok":"bad"],
    ["Best reward",(p.best_reward>0?"+":"")+Number(p.best_reward).toFixed(1),p.best_reward>0?"ok":"bad"],
    ["Mean reward",(p.mean_reward>0?"+":"")+Number(p.mean_reward).toFixed(1),p.mean_reward>0?"ok":"bad"],
    ["Fleet wall time",(p.wallclock_ms/1000).toFixed(1)+"s","star"]]);
  BOUNDS=bounds(WORLDS);maxFrames=Math.max(...WORLDS.map(w=>w.path.length));
  scrub.max=maxFrames-1;frame=0;
  WORLDS.forEach((w,i)=>{const c=cards[i];if(!c)return;c.w=w;c.el.className="card";
    c.key.textContent=Object.keys(w.key||{}).length
      ?Object.entries(w.key).map(([k,v])=>k.replace("layout_id","L").replace("orbital_phase","φ")+" "+(typeof v==="number"?(Number.isInteger(v)?v:v.toFixed(2)):v)).join("  ")
      :"single world";});
  playing=true;playBtn.textContent="Pause";draw();
}

function bounds(ws){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const w of ws){for(const p of w.path){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}
    for(const b of w.env.planets){x0=Math.min(x0,b.x-b.radius);x1=Math.max(x1,b.x+b.radius);y0=Math.min(y0,b.y-b.radius);y1=Math.max(y1,b.y+b.radius);}
    const pt=w.env.portal;x0=Math.min(x0,pt.x-.6);x1=Math.max(x1,pt.x+.6);y0=Math.min(y0,pt.y-.6);y1=Math.max(y1,pt.y+.6);
    for(const fr of w.bodies)for(const b of fr){x0=Math.min(x0,b[0]-.25);x1=Math.max(x1,b[0]+.25);y0=Math.min(y0,b[1]-.25);y1=Math.max(y1,b[1]+.25);}}
  const pad=.35,side=Math.max(x1-x0,y1-y0)+pad*2;return{cx:(x0+x1)/2,cy:(y0+y1)/2,side};}

function draw(){
  if(!BOUNDS)return;const px=v=>(v-BOUNDS.cx)/BOUNDS.side;
  for(const c of cards){const w=c.w;if(!w)continue;const{ctx,cv}=c;const S=cv.clientWidth||260;
    const X=v=>S/2+px(v)*S,Y=v=>S/2-px(v)*S,R=r=>(r/BOUNDS.side)*S;
    const f=Math.min(frame,w.path.length-1),done=frame>=w.path.length-1;
    ctx.clearRect(0,0,S,S);ctx.fillStyle="#070B16";ctx.fillRect(0,0,S,S);
    const star=w.env.planets[0];
    ctx.strokeStyle="rgba(40,50,79,.55)";ctx.lineWidth=1;
    for(let k=1;k<=4;k++){ctx.beginPath();ctx.arc(X(star.x),Y(star.y),R(k*.9),0,7);ctx.stroke();}
    const p=w.env.portal;
    ctx.strokeStyle=col("--portal");ctx.globalAlpha=.5;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.arc(X(p.x),Y(p.y),R(p.r_capture),0,7);ctx.stroke();ctx.globalAlpha=1;
    ctx.fillStyle=col("--portal");ctx.beginPath();ctx.arc(X(p.x),Y(p.y),Math.max(2.2,R(.07)),0,7);ctx.fill();
    const bodies=w.bodies.length?w.bodies[f]:w.env.planets.map(b=>[b.x,b.y]);
    w.env.planets.forEach((b,i)=>{const bx=bodies[i]?bodies[i][0]:b.x,by=bodies[i]?bodies[i][1]:b.y;
      const isStar=i===0,rr=Math.max(2,R(b.radius));
      const g=ctx.createRadialGradient(X(bx),Y(by),rr*.3,X(bx),Y(by),rr*3.4);
      g.addColorStop(0,isStar?"rgba(242,179,61,.42)":"rgba(140,107,224,.34)");g.addColorStop(1,"transparent");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(X(bx),Y(by),rr*3.4,0,7);ctx.fill();
      ctx.fillStyle=isStar?col("--star"):col("--planet");ctx.beginPath();ctx.arc(X(bx),Y(by),rr,0,7);ctx.fill();});
    if(f>0){ctx.strokeStyle="rgba(255,122,102,.24)";ctx.lineWidth=1.1;ctx.beginPath();
      for(let i=0;i<=f;i++){const q=w.path[i];i?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1]));}ctx.stroke();
      const tail=Math.max(0,f-26);ctx.strokeStyle=col("--craft");ctx.lineWidth=1.9;ctx.beginPath();
      for(let i=tail;i<=f;i++){const q=w.path[i];i===tail?ctx.moveTo(X(q[0]),Y(q[1])):ctx.lineTo(X(q[0]),Y(q[1]));}ctx.stroke();}
    const q=w.path[f],v=w.vel[f],ang=Math.atan2(v[1],v[0]);
    ctx.save();ctx.translate(X(q[0]),Y(q[1]));ctx.rotate(-ang);
    ctx.fillStyle=done&&w.st==="crashed"?col("--bad"):col("--craft");
    ctx.beginPath();ctx.moveTo(5.4,0);ctx.lineTo(-3.4,3.1);ctx.lineTo(-1.7,0);ctx.lineTo(-3.4,-3.1);
    ctx.closePath();ctx.fill();ctx.restore();
    if(done&&w.st==="crashed"){ctx.strokeStyle=col("--bad");ctx.globalAlpha=.75;ctx.lineWidth=1.4;
      ctx.beginPath();ctx.arc(X(q[0]),Y(q[1]),8,0,7);ctx.stroke();ctx.globalAlpha=1;}
    if(done){c.el.className="card done-"+(w.st==="success"?"portal":w.st);}
  }
  document.getElementById("tstep").textContent="t "+(frame*2*.02).toFixed(2);
  const live=cards.filter(c=>c.w&&frame<c.w.path.length-1).length;
  document.getElementById("tlive").textContent=live?live+" still flying":"all resolved";
  scrub.value=frame;
}
let last=0;
function loop(ts){if(playing&&WORLDS.length&&ts-last>33/speed){last=ts;
  frame=frame>=maxFrames-1?0:frame+1;draw();}requestAnimationFrame(loop);}
playBtn.onclick=()=>{if(!WORLDS.length)return;playing=!playing;playBtn.textContent=playing?"Pause":"Play";};
scrub.oninput=e=>{frame=+e.target.value;playing=false;playBtn.textContent="Play";draw();};
addEventListener("resize",()=>{sizeAll();draw();});
skeleton();requestAnimationFrame(loop);
</script>

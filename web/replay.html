<title>Gravity Gauntlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --void:#0A0F1E; --panel:#151C31; --panel-2:#111728; --line:#28324F; --line-soft:#1D2540;
  --ink:#E9ECF7; --ink-dim:#9AA6C4; --ink-faint:#63709A;
  --star:#F2B33D; --portal:#3FD6C4; --craft:#FF7A66; --planet:#8C6BE0;
  --ok:#3FD6C4; --warn:#F2B33D; --bad:#FF6B7A; --idle:#63709A;
  --grid-w:4;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--void); color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13px; line-height:1.5; overflow-x:hidden;
  background-image:radial-gradient(ellipse 90% 60% at 50% -10%,#16203c 0%,transparent 70%);
}
.wrap{max-width:1500px;margin:0 auto;padding:22px 20px 96px}
h1,h2,h3,.disp{font-family:"Chakra Petch","Chakra Petch Fallback",system-ui,sans-serif}

/* ---- rail ---- */
.rail{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;
  border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.02em;text-wrap:balance}
h1 .g{color:var(--star)}
.sub{color:var(--ink-dim);font-size:12px;margin-top:4px;max-width:66ch}
.sub b{color:var(--portal);font-weight:500}

/* ---- rung ladder ---- */
.rungs{display:flex;gap:6px}
.rung{appearance:none;cursor:pointer;background:var(--panel);color:var(--ink-dim);
  border:1px solid var(--line);border-radius:2px;padding:8px 13px;
  font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;transition:background .15s,color .15s,border-color .15s}
.rung:hover{color:var(--ink);border-color:var(--ink-faint)}
.rung[aria-pressed="true"]{background:var(--star);color:#231800;border-color:var(--star)}
.rung:focus-visible{outline:2px solid var(--portal);outline-offset:2px}
.rung small{display:block;font-family:"IBM Plex Mono",monospace;font-weight:400;
  font-size:9px;letter-spacing:.04em;text-transform:none;opacity:.75;margin-top:2px}

/* ---- stat strip ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;
  background:var(--line-soft);border:1px solid var(--line-soft);margin-bottom:8px}
.stat{background:var(--panel-2);padding:10px 13px}
.stat .k{color:var(--ink-faint);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
.stat .v{font-size:19px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;
  font-family:"Chakra Petch",sans-serif}
.stat .v.ok{color:var(--ok)} .stat .v.bad{color:var(--bad)} .stat .v.star{color:var(--star)}

.note{color:var(--ink-faint);font-size:11.5px;margin:0 0 18px;padding:9px 13px;
  border-left:2px solid var(--line);background:var(--panel-2)}
.note b{color:var(--ink-dim);font-weight:500}

/* ---- grid ---- */
.grid{display:grid;grid-template-columns:repeat(var(--grid-w),1fr);gap:12px}
@media(max-width:1180px){:root{--grid-w:3}}
@media(max-width:860px){:root{--grid-w:2}}
@media(max-width:560px){:root{--grid-w:1}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow:hidden;
  display:flex;flex-direction:column;transition:border-color .2s}
.card.done-portal{border-color:rgba(63,214,196,.55)}
.card.done-crashed{border-color:rgba(255,107,122,.5)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:7px 10px;border-bottom:1px solid var(--line-soft);background:var(--panel-2)}
.sbx{color:var(--ink-faint);font-size:10px;letter-spacing:.04em}
.sbx b{color:var(--ink-dim);font-weight:500}
.chip{font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2.5px 7px;border-radius:2px;
  font-family:"Chakra Petch",sans-serif;font-weight:600;white-space:nowrap}
.chip.running{background:rgba(99,112,154,.18);color:var(--idle)}
.chip.success{background:rgba(63,214,196,.15);color:var(--ok)}
.chip.crashed{background:rgba(255,107,122,.15);color:var(--bad)}
.chip.timeout{background:rgba(242,179,61,.13);color:var(--warn)}
.chip.escaped{background:rgba(140,107,224,.16);color:var(--planet)}
canvas{display:block;width:100%;height:auto;background:#070B16}
.card .bot{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;
  border-top:1px solid var(--line-soft);font-size:10.5px;color:var(--ink-faint);
  font-variant-numeric:tabular-nums}
.card .bot .rw{color:var(--ink-dim);font-weight:500}
.card .bot .rw.pos{color:var(--ok)} .card .bot .rw.neg{color:var(--bad)}

/* ---- transport ---- */
.transport{position:fixed;left:0;right:0;bottom:0;background:rgba(10,15,30,.94);
  border-top:1px solid var(--line);backdrop-filter:blur(8px);padding:11px 20px;z-index:5}
.tin{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:14px}
button.play{appearance:none;cursor:pointer;background:var(--portal);color:#04211E;border:0;
  border-radius:2px;padding:8px 16px;font-family:"Chakra Petch",sans-serif;font-weight:700;
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;min-width:74px}
button.play:hover{filter:brightness(1.1)}
button.play:focus-visible{outline:2px solid var(--star);outline-offset:2px}
input[type=range]{flex:1;accent-color:var(--star);cursor:pointer;min-width:80px}
input[type=range]:focus-visible{outline:2px solid var(--portal);outline-offset:3px}
.tlabel{color:var(--ink-faint);font-size:10.5px;letter-spacing:.06em;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.spd{display:flex;gap:3px}
.spd button{appearance:none;cursor:pointer;background:var(--panel);border:1px solid var(--line);
  color:var(--ink-faint);border-radius:2px;padding:5px 8px;font-family:"IBM Plex Mono",monospace;font-size:10px}
.spd button[aria-pressed="true"]{background:var(--line);color:var(--ink)}
.spd button:focus-visible{outline:2px solid var(--portal);outline-offset:1px}
@media(max-width:640px){.tlabel.wide{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <div class="rail">
    <div>
      <h1><span class="g">Gravity</span> Gauntlet</h1>
      <p class="sub">Eight Daytona sandboxes, one frozen policy, one generation. Every path below
      was integrated inside a <b>real remote sandbox</b> and replayed here from its recorded
      trajectory &mdash; the ids are the actual sandbox ids.</p>
    </div>
    <div class="rungs" role="group" aria-label="Curriculum rung"></div>
  </div>
  <div class="stats"></div>
  <p class="note"></p>
  <div class="grid"></div>
</div>
<div class="transport">
  <div class="tin">
    <button class="play" type="button">Pause</button>
    <span class="tlabel" id="tstep">t 0.00</span>
    <input type="range" id="scrub" min="0" max="100" value="0" aria-label="Scrub timeline">
    <span class="tlabel wide" id="tlive">8 live</span>
    <span class="spd" role="group" aria-label="Playback speed"></span>
  </div>
</div>

],[3.28,-0.805]],[[-0.0,-0.0],[1.781,1.711],[3.287,-0.774]],[[-0.0,-0.0],[1.755,1.738],[3.295,-0.742]],[[-0.0,-0.0],[1.728,1.765],[3.302,-0.71]],[[-0.0,-0.0],[1.7,1.792],[3.308,-0.678]],[[-0.0,-0.0],[1.672,1.818],[3.315,-0.646]],[[-0.0,-0.0],[1.644,1.843],[3.321,-0.614]],[[-0.0,-0.0],[1.615,1.869],[3.327,-0.582]],[[-0.0,-0.0],[1.586,1.893],[3.332,-0.55]],[[-0.0,-0.0],[1.557,1.918],[3.337,-0.517]],[[-0.0,-0.0],[1.527,1.941],[3.342,-0.485]],[[-0.0,-0.0],[1.497,1.965],[3.347,-0.453]],[[-0.0,-0.0],[1.466,1.988],[3.351,-0.42]],[[-0.0,-0.0],[1.435,2.01],[3.355,-0.388]],[[-0.0,-0.0],[1.404,2.032],[3.358,-0.356]],[[-0.0,-0.0],[1.383,2.046],[3.361,-0.334]]],"env":{"planets":[{"x":-0.0,"y":-0.0,"mass":1.0,"radius":0.15},{"x":-0.07166839151194805,"y":-2.468777762711356,"mass":0.04,"radius":0.11},{"x":-0.4697387716931961,"y":-3.344300447981336,"mass":0.04,"radius":0.11}],"portal":{"x":2.6,"y":2.7,"r_capture":0.35,"v_capture":0.6},"ship_start":{"x":2.5,"y":0.0,"vx":0.0,"vy":0.55},"obstacles":[]}}]}}</script>
<script>
const DATA = JSON.parse(document.getElementById("gg-data").textContent);
const C = getComputedStyle(document.documentElement);
const col = n => C.getPropertyValue(n).trim();

const NOTES = {
  A: "<b>Rung A &mdash; one fixed star.</b> All eight sandboxes fly the <em>same</em> world by design; the only thing separating them is action sampling, which is already a variance reduction for the gradient. Champion policy: 4 of 8 reach the portal.",
  B: "<b>Rung B &mdash; star plus fixed planets.</b> Eight <em>different</em> layouts in one generation. The policy is under-trained here (1 of 8 captures, 2 collisions) &mdash; it transfers from rung A rather than improving on it.",
  C: "<b>Rung C &mdash; orbiting bodies.</b> The planets move, so the field is time-dependent. This policy reaches the portal but arrives too fast for the capture speed gate, so it scores 0 of 8: it learned to fly there and not to brake."
};

let stage = "A", frame = 0, playing = true, speed = 1, maxFrames = 1;
const grid = document.querySelector(".grid");
const statsEl = document.querySelector(".stats");
const noteEl = document.querySelector(".note");
const scrub = document.getElementById("scrub");
const playBtn = document.querySelector("button.play");

// ---- rung ladder
const rungs = document.querySelector(".rungs");
["A","B","C"].forEach(s => {
  const b = document.createElement("button");
  b.className = "rung"; b.type = "button";
  b.innerHTML = `Rung ${s}<small>${DATA[s].title}</small>`;
  b.setAttribute("aria-pressed", s === stage);
  b.onclick = () => { stage = s; frame = 0; build(); };
  rungs.appendChild(b);
});
const spd = document.querySelector(".spd");
[0.5,1,2].forEach(v => {
  const b = document.createElement("button"); b.type = "button";
  b.textContent = v + "×"; b.setAttribute("aria-pressed", v === speed);
  b.onclick = () => { speed = v; [...spd.children].forEach(c =>
    c.setAttribute("aria-pressed", c.textContent === v + "×")); };
  spd.appendChild(b);
});

// ---- world -> screen, one shared frame for the whole rung
function bounds(sd){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const w of sd.worlds){
    for(const p of w.path){ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }
    for(const b of w.env.planets){ x0=Math.min(x0,b.x-b.radius); x1=Math.max(x1,b.x+b.radius);
                                   y0=Math.min(y0,b.y-b.radius); y1=Math.max(y1,b.y+b.radius); }
    const pt=w.env.portal; x0=Math.min(x0,pt.x-.6); x1=Math.max(x1,pt.x+.6);
    y0=Math.min(y0,pt.y-.6); y1=Math.max(y1,pt.y+.6);
    for(const fr of w.bodies) for(const b of fr){ x0=Math.min(x0,b[0]-.25); x1=Math.max(x1,b[0]+.25);
                                                  y0=Math.min(y0,b[1]-.25); y1=Math.max(y1,b[1]+.25); }
  }
  const pad=.35, w=x1-x0+pad*2, h=y1-y0+pad*2, side=Math.max(w,h);
  return {cx:(x0+x1)/2, cy:(y0+y1)/2, side};
}

let BOUNDS=null, cards=[];

function build(){
  const sd = DATA[stage];
  BOUNDS = bounds(sd);
  maxFrames = Math.max(...sd.worlds.map(w => w.path.length));
  scrub.max = maxFrames - 1;
  [...rungs.children].forEach((b,i) => b.setAttribute("aria-pressed", ["A","B","C"][i] === stage));
  noteEl.innerHTML = NOTES[stage];

  const nOk = sd.worlds.filter(w => w.st === "success").length;
  statsEl.innerHTML = "";
  const stats = [
    ["Generation", "#" + sd.generation, ""],
    ["Sandboxes", sd.worlds.length, ""],
    ["Reached portal", nOk + " / " + sd.worlds.length, nOk ? "ok" : "bad"],
    ["Best reward", (sd.best_reward>0?"+":"") + sd.best_reward.toFixed(1), sd.best_reward>0?"ok":"bad"],
    ["Mean reward", (sd.mean_reward>0?"+":"") + sd.mean_reward.toFixed(1), sd.mean_reward>0?"ok":"bad"],
    ["Fleet wall time", (sd.wall_ms/1000).toFixed(1) + "s", "star"],
  ];
  for(const [k,v,cls] of stats){
    const d = document.createElement("div"); d.className="stat";
    d.innerHTML = `<div class="k">${k}</div><div class="v ${cls}">${v}</div>`;
    statsEl.appendChild(d);
  }

  grid.innerHTML = ""; cards = [];
  for(const w of sd.worlds){
    const el = document.createElement("div"); el.className = "card";
    const keyTxt = Object.keys(w.key).length
      ? Object.entries(w.key).map(([k,v]) => k.replace("layout_id","L").replace("orbital_phase","φ")
        + " " + (typeof v === "number" ? (Number.isInteger(v)? v : v.toFixed(2)) : v)).join("  ")
      : "single world";
    el.innerHTML =
      `<div class="top"><span class="sbx">sbx <b>${w.sb}</b></span><span class="chip running">running</span></div>`+
      `<canvas></canvas>`+
      `<div class="bot"><span>${keyTxt}</span><span class="rw"></span></div>`;
    grid.appendChild(el);
    const cv = el.querySelector("canvas");
    cards.push({w, el, cv, ctx: cv.getContext("2d"),
                chip: el.querySelector(".chip"), rw: el.querySelector(".rw")});
  }
  sizeAll(); draw();
}

function sizeAll(){
  for(const c of cards){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const w = c.cv.clientWidth || 260;
    c.cv.width = Math.round(w*dpr); c.cv.height = Math.round(w*dpr);
    c.cv.style.height = w + "px";
    c.ctx.setTransform(dpr,0,0,dpr,0,0);
  }
}

function draw(){
  const px = c => (c - BOUNDS.cx)/BOUNDS.side;
  for(const c of cards){
    const {ctx, cv, w} = c;
    const S = cv.clientWidth || 260;
    const X = v => S/2 + px(v)*S, Y = v => S/2 - px(v)*S;   // y up
    const R = r => (r/BOUNDS.side)*S;
    const f = Math.min(frame, w.path.length-1);
    const done = frame >= w.path.length-1;

    ctx.clearRect(0,0,S,S);
    ctx.fillStyle = "#070B16"; ctx.fillRect(0,0,S,S);

    // gravity-well rings, centred on the star
    const star = w.env.planets[0];
    ctx.strokeStyle = "rgba(40,50,79,.55)"; ctx.lineWidth = 1;
    for(let k=1;k<=4;k++){
      ctx.beginPath(); ctx.arc(X(star.x), Y(star.y), R(k*0.9), 0, 7); ctx.stroke();
    }

    // portal + capture radius
    const p = w.env.portal;
    ctx.strokeStyle = col("--portal"); ctx.globalAlpha=.5; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), R(p.r_capture), 0, 7); ctx.stroke();
    ctx.globalAlpha=1; ctx.fillStyle = col("--portal");
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), Math.max(2.2,R(0.07)), 0, 7); ctx.fill();

    // bodies at this instant (they move from rung C)
    const bodies = w.bodies.length ? w.bodies[f] : w.env.planets.map(b => [b.x,b.y]);
    w.env.planets.forEach((b,i) => {
      const bx = bodies[i] ? bodies[i][0] : b.x, by = bodies[i] ? bodies[i][1] : b.y;
      const isStar = i === 0;
      const rr = Math.max(2, R(b.radius));
      const g = ctx.createRadialGradient(X(bx),Y(by),rr*0.3,X(bx),Y(by),rr*3.4);
      g.addColorStop(0, isStar ? "rgba(242,179,61,.42)" : "rgba(140,107,224,.34)");
      g.addColorStop(1, "transparent");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X(bx),Y(by),rr*3.4,0,7); ctx.fill();
      ctx.fillStyle = isStar ? col("--star") : col("--planet");
      ctx.beginPath(); ctx.arc(X(bx),Y(by),rr,0,7); ctx.fill();
    });

    // flown trail
    if(f > 0){
      ctx.strokeStyle = "rgba(255,122,102,.24)"; ctx.lineWidth = 1.1; ctx.beginPath();
      for(let i=0;i<=f;i++){ const q=w.path[i]; i?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1])); }
      ctx.stroke();
      const tail = Math.max(0, f-26);
      ctx.strokeStyle = col("--craft"); ctx.lineWidth = 1.9; ctx.beginPath();
      for(let i=tail;i<=f;i++){ const q=w.path[i]; i===tail?ctx.moveTo(X(q[0]),Y(q[1])):ctx.lineTo(X(q[0]),Y(q[1])); }
      ctx.stroke();
    }

    // craft, pointed along its velocity
    const q = w.path[f], v = w.vel[f], ang = Math.atan2(v[1], v[0]);
    ctx.save(); ctx.translate(X(q[0]), Y(q[1])); ctx.rotate(-ang);
    ctx.fillStyle = done && w.st === "crashed" ? col("--bad") : col("--craft");
    ctx.beginPath(); ctx.moveTo(5.4,0); ctx.lineTo(-3.4,3.1); ctx.lineTo(-1.7,0); ctx.lineTo(-3.4,-3.1);
    ctx.closePath(); ctx.fill(); ctx.restore();

    if(done && w.st === "crashed"){
      ctx.strokeStyle = col("--bad"); ctx.globalAlpha=.75; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(X(q[0]),Y(q[1]), 8, 0, 7); ctx.stroke(); ctx.globalAlpha=1;
    }

    const st = done ? w.st : "running";
    if(c.chip.textContent !== st){
      c.chip.textContent = st; c.chip.className = "chip " + st;
      c.el.className = "card" + (done ? " done-" + (w.st==="success"?"portal":w.st) : "");
    }
    c.rw.textContent = done ? ((w.rw>0?"+":"") + w.rw.toFixed(1)) : "t " + (f*3*0.02).toFixed(2);
    c.rw.className = "rw" + (done ? (w.rw>0?" pos":" neg") : "");
  }
  document.getElementById("tstep").textContent = "t " + (frame*3*0.02).toFixed(2);
  const live = cards.filter(c => frame < c.w.path.length-1).length;
  document.getElementById("tlive").textContent = live ? live + " still flying" : "all resolved";
  scrub.value = frame;
}

let last = 0;
function loop(ts){
  if(playing && ts - last > 33/speed){
    last = ts;
    frame = frame >= maxFrames-1 ? 0 : frame+1;
    draw();
  }
  requestAnimationFrame(loop);
}
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? "Pause" : "Play"; };
scrub.oninput = e => { frame = +e.target.value; playing = false; playBtn.textContent = "Play"; draw(); };
addEventListener("resize", () => { sizeAll(); draw(); });
if(matchMedia("(prefers-reduced-motion: reduce)").matches){ playing = false; playBtn.textContent = "Play"; }
build();
requestAnimationFrame(loop);
</script>
